name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install handbook dependencies
        run: npm --prefix site ci --ignore-scripts

      - name: Install Chromium for Mermaid rendering
        run: npx --prefix site --no-install playwright install --with-deps chromium

      - name: Install validation tools
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: |
            zizmor@1.29.0

      - name: Install Go validation tools
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Install chezmoi
        env:
          CHEZMOI_VERSION: 2.72.1
          CHEZMOI_SHA256: 9f97d32caca166e5c92160ec3a9325519809c38963121cef38173142065c981f
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}/chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/chezmoi.tar.gz"
          printf '%s  %s\n' "$CHEZMOI_SHA256" "$RUNNER_TEMP/chezmoi.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/bin" chezmoi

      - name: Install shell test tools
        run: sudo apt-get update && sudo apt-get install -y bats zsh fish cmake

      - name: Run shared quality validation
        run: ./tests/ci.sh quality

  macos-smoke:
    name: macOS smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools
        run: brew install bats-core jq shellcheck

      - name: Check shell and platform contracts
        run: ./tests/ci.sh macos

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5

      - name: Validate infrastructure
        run: ./tests/ci.sh infrastructure

  bootstrap:
    name: Bootstrap (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run core-profile bootstrap suite
        run: ./tests/run.sh
