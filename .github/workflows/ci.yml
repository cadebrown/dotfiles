name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: |
            mdbook@0.5.4
            mdbook-mermaid@0.17.1
            zizmor@1.29.0

      - name: Install Go validation tools
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Check shell syntax
        run: bash -n bootstrap.sh install/*.sh home/dot_local/bin/executable_git-wt

      - name: Run ShellCheck
        run: shellcheck -S warning bootstrap.sh install/*.sh home/dot_local/bin/executable_git-wt

      - name: Run fast Bats tests
        env:
          REPO: ${{ github.workspace }}
        run: |
          ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"
          bats \
            tests/agents.bats \
            tests/bootstrap-remote.bats \
            tests/brew-glibc.bats \
            tests/gwt.bats \
            tests/lean.bats \
            tests/mcp-emitters.bats \
            tests/netrc.bats \
            tests/platform-upgrade.bats \
            tests/profiles.bats \
            tests/rust-glibc-smoke.bats \
            tests/toolchains.bats \
            tests/verify-path.bats

      - name: Build documentation
        run: mdbook build docs

      - name: Scan secrets
        run: gitleaks git --no-banner --redact .

      - name: Lint workflows
        run: |
          actionlint
          zizmor --pedantic .github/workflows

  macos-smoke:
    name: macOS smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools
        run: brew install bats-core jq shellcheck

      - name: Check shell and platform contracts
        env:
          REPO: ${{ github.workspace }}
        run: |
          bash -n bootstrap.sh install/*.sh home/dot_local/bin/executable_git-wt
          shellcheck -S warning bootstrap.sh install/*.sh home/dot_local/bin/executable_git-wt
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            /bin/bash "$(brew --prefix bats-core)/bin/bats" \
              tests/agents.bats \
              tests/bootstrap-remote.bats \
              tests/gwt.bats \
              tests/mcp-emitters.bats \
              tests/platform-upgrade.bats \
              tests/toolchains.bats \
              tests/verify-path.bats

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5

      - name: Check formatting
        working-directory: infra/cloudflare
        run: tofu fmt -check

      - name: Initialize without backend
        working-directory: infra/cloudflare
        run: tofu init -backend=false

      - name: Validate configuration
        working-directory: infra/cloudflare
        run: tofu validate

  bootstrap:
    name: Bootstrap (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run core-profile bootstrap suite
        run: ./tests/run.sh
